//
// This is an alternate startup script
// for Yamagi Quake II, overriding the
// default.cfg from pak0.pak. 
//
// !!! PLEASE DO NOT ALTER THIS FILE !!!
//
// Instead, put your custom stuff in
// autoexec.cfg. It's also executed
// at startup.
//

//
// KEY BINDINGS
//

unbindall

bind	1		"use Blaster"
bind	2		"use Shotgun"
bind	3		"use Super Shotgun"
bind	4		"use Machinegun"
bind	5		"use Chaingun"
bind	6		"use Grenade Launcher"
bind	7		"use Rocket Launcher"
bind	8		"use HyperBlaster"
bind	9		"use Railgun"
bind	0		"use BFG10K"

bind	MOUSE1		+attack

bind	TRIG_RIGHT	+attack
bind	TRIG_LEFT	+moveup
bind	BTN_A		+moveup
bind	BTN_B		+movedown
bind	BTN_X		weapnext
bind	BTN_Y		inven
bind	BTN_GUIDE	+moveup
bind	BTN_START	pause
bind	BTN_BACK	menu_main
bind	SHOULDR_LEFT	weapprev
bind	SHOULDR_RIGHT	weapnext
bind	DP_UP		invprev
bind	DP_DOWN		invnext
bind	DP_LEFT		invdrop
bind	DP_RIGHT	invuse

bind	d		+back
bind	e		+forward
bind	s		+moveleft
bind	a		+left
bind	f		+moveright
bind	g		+right

bind	TAB		inven
bind	ENTER		invuse
bind	o		invprev
bind	p		invnext
bind	BACKSPACE	invdrop

bind	MWHEELDOWN	weapprev
bind	MWHEELUP	weapnext

bind	q		"use quad damage"
bind	w		"use power shield"

bind	SHIFT		+speed

bind	SPACE		+movedown
bind	MOUSE2		+moveup

bind	PAUSE		pause

bind	F1		"cmd help"
bind	F5		"echo Quick Saving...; wait; save quick"
bind	F9		"echo Quick Loading...; wait; load quick"
bind	F12		screenshot jpg 90

bind	t		messagemode

//----------------------------------------------

//
// DEFAULT CVARS
//

set	viewsize	100
set	vid_fullscreen	0
set	r_mode		4
set	sensitivity	3
set	crosshair	1
set	cl_run		1
set	hand		0
set	m_pitch		0.022
set	m_yaw		0.022
set	m_forward	1
set	m_side		0.8
set	lookspring	0
set	lookstrafe	0
set	freelook	1
set	busywait	0
set	s_initsound	1
set	s_khz		48
set	s_mixahead	0.14
set	s_volume	0.7
set	ogg_enable	1
set	r_shadows	1
set	gl1_stencilshadow	0
set	r_consolescale	1
set	r_menuscale	-1

// PS3 extensions. Enable Move or stereo in autoexec.cfg when wanted.
set	ps3_stereo_enable	0
set	ps3_stereo_depth	1.0
set	ps3_output_scale	0
set	ps3_spu_accel		0
set	ps3_spu_workers	4
set	ps3_rsx_texture_rename	1
set	ps3_rsx_texture_frame_reuse	1
set	ps3_rsx_batch		1
set	ps3_rsx_indexed_batch	1
set	ps3_rsx_state_filter	1
set	ps3_rsx_fast_arrays	1
set	ps3_rsx_static_world	1
set	ps3_rsx_stereo_lightmap_reuse	1
set	ps3_rsx_stereo_lightmap_atlas	1
set	ps3_rsx_stream_main_memory	0
set	ps3_rsx_tiled_targets	0
set	ps3_rsx_stats		0
set	ps3_rsx_fps_target	0
set	gl1_stereo_separation	1
set	psmove_enable	0
set	psmove_deadzone	0.025
set	psmove_smoothing	0.35
set	psmove_yawsensitivity	1.0
set	psmove_pitchsensitivity	1.0
set	psmove_invertpitch	0
